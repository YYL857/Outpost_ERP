<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Listing Capture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 340px;
        margin: 12px;
        font-size: 13px;
      }
      button {
        width: 100%;
        padding: 8px;
        cursor: pointer;
        margin-top: 6px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-top: 8px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-top: 4px;
      }
      #msg {
        margin-top: 8px;
        color: #444;
        white-space: pre-wrap;
      }
      .hint {
        color: #666;
        font-size: 12px;
        margin: 0 0 8px;
      }
      .row2 {
        display: flex;
        gap: 6px;
      }
      .row2 button {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <p>在 Noon <strong>单个商品详情页</strong>采集对手标题/价格/卖点，写入<strong>你自己的</strong> Listing inbox。</p>
    <p class="hint">
      每位同事须填写自己的 Outpost
      <strong>登录用户名</strong>（与网页登录相同），否则导入时看到空。
    </p>
    <label for="username">Outpost 用户名</label>
    <input id="username" type="text" placeholder="与网页登录名相同" autocomplete="username" />
    <label for="apiBase">Outpost API 地址</label>
    <input id="apiBase" type="text" placeholder="http://192.168.1.112:8787" />
    <div class="row2">
      <button id="saveApi" type="button">保存设置</button>
      <button id="ping" type="button">测试连接</button>
    </div>
    <button id="capture" type="button">采集本品页 → Listing</button>
    <div id="msg"></div>
    <script src="popup.js"></script>
  </body>
</html>
