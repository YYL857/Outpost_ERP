<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="前哨 Outpost">
  <!-- 前哨：瞭望塔 + 地平线，品牌色 #0b6b61 -->
  <rect width="32" height="32" rx="8" fill="#0b6b61"/>
  <!-- 地平线 -->
  <path d="M7 23.5h18" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <!-- 塔身 -->
  <path d="M13.5 23.5V12.5h5V23.5" stroke="#fff" stroke-width="1.75" stroke-linejoin="round"/>
  <!-- 瞭望台 -->
  <path d="M11.5 12.5h9v2.25h-9z" fill="#fff"/>
  <!-- 观测点 -->
  <circle cx="16" cy="9.25" r="2.15" fill="#fff"/>
  <circle cx="16" cy="9.25" r="0.85" fill="#0b6b61"/>
</svg>
